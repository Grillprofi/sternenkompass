<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Sternenkompass</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0a0e1a; color: #e9edf8;
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: grid; place-items: center; text-align: center; padding: 24px;
  }
  .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #f0c66a; }
  h1 { font-size: 34px; margin: 10px 0 8px; letter-spacing: -.01em; }
  p { color: #8d96ad; max-width: 30rem; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f0c66a; margin-right: 8px; animation: p 1.6s ease-in-out infinite; }
  @keyframes p { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none } }
</style>
</head>
<body>
  <main>
    <div class="eyebrow">Sternenkompass</div>
    <h1>Die Himmelskarte entsteht gerade</h1>
    <p><span class="dot"></span>Hier erscheint in Kürze die Live-Sternkarte: Handy an den Himmel halten, Sterne, Planeten und Sternbilder erkunden.</p>
  </main>
</body>
</html>
