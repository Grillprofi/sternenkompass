name: Deploy Pages

# Pages ist als "Deploy from branch: gh-pages" aktiv.
# Dieser Workflow spiegelt main nach gh-pages; den eigentlichen
# Pages-Build uebernimmt GitHub danach automatisch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: main nach gh-pages spiegeln
        run: git push origin +HEAD:gh-pages
